name: 'Report status in issue'
description: 'Report status of a workflow run into a GitHub issue'
inputs:
  github-token:
    description: 'GitHub token'
    required: true
  action:
    description: 'Name of the action (if named)'
    required: false
  status:
    description: 'Status of the CI run'
    required: true
  issue-repository:
    description: 'The repository where the issue resides (e.g. quarkusio/quarkus)'
    required: true
  issue-number:
    description: 'The issue to update'
    required: true
  repository:
    description: 'The repository for which we are reporting the CI status (by default, the repository running the action)'
    required: false
  run-id:
    description: 'The ID of the Github Action run for which we are reporting the CI status (by default, the run id of the current run)'
    required: false
  quarkus-sha:
    description: 'The Git sha of the Quarkus build used to run the tests'
    required: false
  project-sha:
    description: 'The Git sha of the project currently under test'
    required: false

runs:
  using: "composite"
  steps:
    - name: Inject quarkus-github-action repository credentials
      shell: bash
      run: |
        if [ -f ~/.m2/settings.xml ]; then
          if ! grep -q '<id>quarkus-github-action</id>' ~/.m2/settings.xml; then
            yq -p xml -o xml -i '.settings.servers.server |= (. | [.] + [{"id": "quarkus-github-action", "username": "${env.GITHUB_ACTOR}", "password": "${env.GITHUB_TOKEN}"}])' ~/.m2/settings.xml
          fi
        else
          mkdir -p ~/.m2/
          yq -p xml -o xml -n '.settings.servers.server = {"id": "quarkus-github-action", "username": "${env.GITHUB_ACTOR}", "password": "${env.GITHUB_TOKEN}"}' > ~/.m2/settings.xml
        fi
    - name: Set up Java 25
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '25'
        set-default: false
    - name: Set up JBang
      uses: jbangdev/setup-jbang@main
    - name: Run the action
      id: action
      run: |
        if [[ -n "${JAVA_HOME_25_X64}" ]]; then
          echo "Installing ${JAVA_HOME_25_X64} as JDK 25 for JBang"
          jbang --verbose jdk install java-25 ${JAVA_HOME_25_X64}
        fi
        jbang --java 25 --fresh --repos 'quarkus-github-action=https://maven.pkg.github.com/quarkusio/report-status-in-issue/' --repos 'mavencentral' io.quarkus.bot:report-status-in-issue:999-SNAPSHOT
      shell: bash
      env:
        JSON_INPUTS: ${{ toJSON(inputs) }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
